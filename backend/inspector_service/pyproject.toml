[project]
name = "inspector-service"
version = "0.1.0"
description = "Standalone local-model activation/attention/logit-lens inspection service for Obsidian AI's phase 2 model auditor. Deliberately isolated from the main backend's venv — heavy ML deps (torch, nnsight) and GPU memory pressure never touch the main app's process. Communicates with the main backend over a small local HTTP API only; has no database, no LLM-provider abstraction, and no auth beyond trusting localhost (same trust model as this project's MCP stdio servers / sandbox containers)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "torch==2.6.0+cu124",
    "nnsight>=0.5.0",
    "transformers>=4.57.3",
    "safetensors>=0.4.5",
    "numpy>=1.26.0",
    "huggingface-hub>=0.26.0",
]

[project.optional-dependencies]
nnterp = [
    "nnterp>=0.1.0",  # optional thin naming-convenience layer over nnsight; code must work without it
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
